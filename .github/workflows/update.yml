name: Update GL.iNet CN Direct List

on:
  workflow_dispatch:
  schedule:
    - cron: "23 2 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Build lists
        run: python update.py

      - name: Commit updated lists
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add glinet-cn-direct.txt glinet-cn-direct-lite.txt status.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore: update GL.iNet direct lists"
            git push
          fi
